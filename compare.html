<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Compare Products | TechStore</title>

    <meta name="description"
          content="Compare laptops, gaming PCs, desktops and computer accessories at TechStore.">

    <meta name="robots" content="noindex,follow">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">
        <div class="container navbar">

            <a href="index.html" class="logo">
                <span class="logo-icon">T</span>
                <span>Tech<span class="blue">Store</span></span>
            </a>

            <nav class="nav-menu" id="navMenu">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="categories.html">Categories</a>
            <a href="deals.html">Deals</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="blog.html">Blog</a>
            <a href="faq.html">FAQ</a>
        </nav>

            <div class="nav-actions">

                <button class="icon-btn" id="searchBtn" type="button" title="Search" aria-label="Open search" aria-expanded="false" aria-controls="searchContainer">
                    🔍
                </button>

                <a href="wishlist.html" class="icon-btn" title="Wishlist">
                    ♡
                    <span class="badge" id="wishlistCount">0</span>
                </a>

                <a href="cart.html" class="icon-btn" title="Cart">
                    🛒
                    <span class="badge" id="cartCount">0</span>
                </a>

                <a href="compare.html" class="icon-btn active" title="Compare">
                    ⚖️
                    <span class="badge" id="compareCount">0</span>
                </a>

                <a href="login.html" class="icon-btn js-account-link" title="Login" data-label="Account"><span class="account-icon">👤</span></a>

                <button class="menu-btn" id="menuBtn" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="navMenu">
                    ☰
                </button>

            </div>

        </div>
    </header>


    <!-- ================= MAIN ================= -->

    <main class="compare-page">

        <div class="breadcrumb">
            <a href="index.html">Home</a>
            <span>›</span>
            <span>Compare Products</span>
        </div>

        <section class="compare-header">

            <h1>Compare Products</h1>

            <p>
                Compare your selected products and choose the one
                that best suits your needs.
            </p>

            <button id="clearCompareBtn"
                    class="clear-compare-btn">
                Clear Comparison
            </button>

        </section>


        <!-- Comparison content -->

        <section id="compareContainer">

            <!-- JavaScript will generate comparison here -->

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026 TechStore. All rights reserved.
        </p>

        <p>
            Smart Technology. Better Choices.
        </p>

    </footer>


    <div class="toast" id="toast">
    <span id="toastMessage"></span>
</div>


<script src="script.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            updateNavbarCounts();

            if (typeof renderComparePage === "function") {
                renderComparePage();
            }

            const clearButton =
                document.getElementById("clearCompareBtn");

            if (clearButton) {

                clearButton.addEventListener("click", function () {

                    if (typeof clearCompare === "function") {

                        clearCompare();

                        renderComparePage();

                        showToast("Comparison cleared.");

                    }

                });

            }

        });
    </script>

</body>
</html>
